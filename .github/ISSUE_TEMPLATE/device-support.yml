name: Pedido de dispositivo
description: Peça para o Pulso ler um mouse, teclado ou headset que ainda não é suportado
title: "[dispositivo] <marca e modelo exato>"
labels: ["device request"]
body:
  - type: markdown
    attributes:
      value: |
        Valeu! Dados bons aqui muitas vezes são tudo que alguém precisa para adicionar o dispositivo.
        Requests in English are welcome too.
  - type: input
    id: model
    attributes:
      label: Marca e modelo exato
      description: Inclua sufixos como Pro, Max, SE, geração ou revisão de hardware.
      placeholder: Razer DeathAdder V3 Pro
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Conexão
      options:
        - Receptor / dongle 2.4 GHz
        - Bluetooth
        - Cabo USB
        - Mais de uma (explique abaixo)
    validations:
      required: true
  - type: textarea
    id: official
    attributes:
      label: Onde a bateria aparece hoje
      description: O Pulso só lê o que o dispositivo informa. Qual app oficial ou driver web mostra a bateria, e o que ele mostra agora?
      placeholder: O Razer Synapse 4 mostra 72%, sem carregar.
    validations:
      required: true
  - type: textarea
    id: probe
    attributes:
      label: Saída do probe
      description: |
        Com o dispositivo ligado e acordado, rode `cargo run --bin probe -- --all` (ou `pulso-probe.exe --all`, que vem em cada release) e cole tudo.
        Ele só lista as coleções HID e nunca escreve em dispositivos desconhecidos.
      render: text
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Algo mais
      description: Links de projetos open source que já leem esse dispositivo, capturas USB, versão de firmware.
