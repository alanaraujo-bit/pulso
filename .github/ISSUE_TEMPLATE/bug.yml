name: Relato de bug
description: Algo está errado ou quebrou
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: O que aconteceu
      description: E o que você esperava. Prints ajudam muito.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Liguei o cabo do headset
        2. Abri o painel
        3. Continua "Em uso" em vez de carregando
  - type: input
    id: devices
    attributes:
      label: Dispositivos envolvidos
      placeholder: Logitech PRO X 2 LIGHTSPEED, AULA F75
  - type: input
    id: version
    attributes:
      label: Versão do Pulso e build do Windows
      placeholder: Pulso 0.1.0, Windows 11 26100
    validations:
      required: true
  - type: textarea
    id: probe
    attributes:
      label: Saída do probe (se for problema de leitura)
      description: "`cargo run --bin probe` com o dispositivo acordado."
      render: text
