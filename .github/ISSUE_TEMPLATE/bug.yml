name: Bug report
description: Something looks wrong or broke
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead. Screenshots help a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Plug the headset cable in
        2. Open the panel
        3. It still says "Em uso" instead of charging
  - type: input
    id: devices
    attributes:
      label: Devices involved
      placeholder: Logitech PRO X 2 LIGHTSPEED, AULA F75
  - type: input
    id: version
    attributes:
      label: Pulso version and Windows build
      placeholder: Pulso 0.1.0, Windows 11 26100
    validations:
      required: true
  - type: textarea
    id: probe
    attributes:
      label: Probe output (if it is a device reading problem)
      description: "`cargo run --bin probe` with the device awake."
      render: text
